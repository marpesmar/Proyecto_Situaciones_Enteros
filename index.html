    .header { text-align: center; margin-bottom: 22px; }

      font-size: 12px;
      font-weight: 900;

      align-items: center;

      margin-top: 13px;
      padding: 7px 13px;

    .question-icon {

      place-items: center;
      border-radius: 17px;
      background: #e8f4ff;
      font-size: 35px;
    }
    .question-label {

      color: #63809a;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.3px;
    }
    .question-text {

      line-height: 1.35;

    .instruction {

      color: #45627e;
      font-size: 14px;
      text-align: center;
    }

      justify-content: center;

      background: #fff;

      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;

    .placeholder {

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
    }

      width: 100%;
      max-width: 570px;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin: 0 auto;
    }
    .key {

      border: 0;
      border-radius: 11px;
      background: #123d6a;
      color: #fff;
      box-shadow: 0 4px 0 #092949;
      font-size: 22px;
      font-weight: 900;

    .key.selected {

      box-shadow: 0 0 0 3px #8dc9f2 inset, 0 4px 0 #164d77;
    }
    .key.clear {
      grid-column: span 2;
      background: #315678;
      font-size: 15px;
    }
    .key.confirm {
      grid-column: span 3;
      background: #176b43;
      box-shadow: 0 4px 0 #0c4a2d;
      font-size: 16px;
    }
    .hint {
      max-width: 570px;

      font-size: 12px;
      line-height: 1.5;
      text-align: center;

      border-radius: 13px;
      font-size: 16px;
      font-weight: 900;
      text-align: center;

    .feedback.info { border: 1px solid #b8d4f5; background: #e2efff; color: #123f70; }

    .success-icon { display: inline-block; font-size: 24px; animation: bounce .55s ease-in-out; }
    .footnote { margin-top: 16px; color: #668098; font-size: 11px; text-align: center; }

      align-items: center;
      justify-content: center;

      background: #fff;

    }

    }

  </style>

      {id:88,icon:"📚",text:"La biblioteca del centro está en la segunda planta sobre la planta baja.",answer:2},
      {id:89,icon:"🧰",text:"El trastero se encuentra en el quinto nivel bajo la entrada del edificio.",answer:-5},
      {id:90,icon:"🏠",text:"Estoy en el nivel de entrada de una casa, que tomamos como referencia.",answer:0},
      {id:91,icon:"🚁",text:"Un dron vuela 25 metros por encima del punto desde el que despegó.",answer:25},
      {id:92,icon:"🤖",text:"Un robot recorre un túnel situado 12 metros por debajo de la calle.",answer:-12},
      {id:93,icon:"🎈",text:"Un globo se encuentra a 7 metros por encima del lugar donde se soltó.",answer:7},
      {id:94,icon:"🚇",text:"Un túnel pasa 3 metros por debajo del nivel del terreno de referencia.",answer:-3},
      {id:95,icon:"🚶",text:"Desde la salida, camino 40 pasos hacia delante.",answer:40},
      {id:96,icon:"👣",text:"Desde mi posición inicial, doy 12 pasos hacia atrás.",answer:-12},
      {id:97,icon:"🧍",text:"Me quedo exactamente en el lugar donde estaba al comenzar.",answer:0},
      {id:98,icon:"🧊",text:"El congelador está a 18 grados bajo cero.",answer:-18},
      {id:99,icon:"🔭",text:"Un mirador de montaña está a 320 metros sobre el nivel del mar.",answer:320},
      {id:100,icon:"🤖",text:"Un robot está colocado justo en el nivel de referencia de una plataforma.",answer:0}
    ];

    const content = document.getElementById("game-content");
    let questions = [];
    let previousRoundIds = [];
    let currentIndex = 0;
    let score = 0;
    let results = [];
    let digits = "";
    let selectedSign = "";
    let locked = false;
    let feedbackTimer = null;

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Excluye todas las preguntas de la partida inmediatamente anterior.
    function chooseTen() {
      const available = bank.filter(question => !previousRoundIds.includes(question.id));
      // Con 100 preguntas y 10 por partida siempre habrá suficientes opciones.
      return shuffle(available.length >= 10 ? available : bank).slice(0, 10);
    }

    function formatNumber(number) {
      if (number > 0) return "+" + number;
      if (number < 0) return "−" + Math.abs(number);
      return "0";
    }

    function startNewGame() {
      if (feedbackTimer) window.clearTimeout(feedbackTimer);
      questions = chooseTen();
      previousRoundIds = questions.map(question => question.id);
      currentIndex = 0;
      score = 0;
      results = [];
      digits = "";
      selectedSign = "";
      locked = false;
      renderQuestion();
    }

    function renderQuestion() {
      locked = false;
      digits = "";
      selectedSign = "";
      const question = questions[currentIndex];
      const number = currentIndex + 1;

      content.innerHTML = `
        <div class="stats">
          <span class="stat">🚀 RETO ${number} DE 10</span>
          <span class="stat">⭐ ACIERTOS: ${score}</span>
        </div>
        <div class="track"><div class="progress" style="width:${number * 10}%"></div></div>
        <div class="question-card">
          <div class="question-icon" aria-hidden="true">${question.icon}</div>
          <div>
            <div class="question-label">LEE LA SITUACIÓN</div>
            <div class="question-text">${question.text}</div>
          </div>
        </div>
        <p class="instruction">¿Qué número entero representa esta situación?</p>
        <div class="answer-display" id="answer-display"><span class="placeholder">Tu respuesta aparecerá aquí</span></div>
        <div class="keypad" aria-label="Teclado numérico">
          <button type="button" class="key sign" data-sign="+" aria-label="Signo más" aria-pressed="false">+</button>
          <button type="button" class="key sign" data-sign="-" aria-label="Signo menos" aria-pressed="false">−</button>
          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key" data-digit="0">0</button>
          <button type="button" class="key clear" id="clear-button">⌫ Borrar</button>
          <button type="button" class="key confirm" id="confirm-button">✓ Confirmar respuesta</button>
        </div>
        <p class="hint">Selecciona + o − cuando sea necesario y después pulsa los números. También puedes dejar el signo sin seleccionar para introducir un número positivo. El cero no lleva signo.</p>
        <div id="feedback-slot" aria-live="assertive"></div>
        <div class="footnote">🔒 Las soluciones se mostrarán únicamente al terminar las 10 situaciones.</div>
      `;

      content.querySelectorAll("[data-sign]").forEach(button => {
        button.addEventListener("click", () => {
          if (locked) return;
          selectedSign = selectedSign === button.dataset.sign ? "" : button.dataset.sign;
          updateDisplay();
          updateSelectedSign();
        });
      });

      content.querySelectorAll("[data-digit]").forEach(button => {
        button.addEventListener("click", () => {
          if (locked || digits.length >= 6) return;
          const digit = button.dataset.digit;
          if (digits === "0") digits = digit === "0" ? "0" : digit;
          else digits += digit;
          updateDisplay();
        });
      });

      document.getElementById("clear-button").addEventListener("click", () => {
        if (locked) return;
        digits = "";
        selectedSign = "";
        updateDisplay();
        updateSelectedSign();
        showInfo("");
      });

      document.getElementById("confirm-button").addEventListener("click", confirmAnswer);
      updateDisplay();
    }

    function updateDisplay() {
      const display = document.getElementById("answer-display");
      if (!display) return;
      if (digits === "") {
        display.innerHTML = '<span class="placeholder">Tu respuesta aparecerá aquí</span>';
      } else {
        const sign = selectedSign === "+" ? "+" : selectedSign === "-" ? "−" : "";
        display.textContent = sign + digits;
      }
    }

    function updateSelectedSign() {
      content.querySelectorAll("[data-sign]").forEach(button => {
        const selected = button.dataset.sign === selectedSign;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });
    }

    function showInfo(message) {
      const slot = document.getElementById("feedback-slot");
      if (!slot) return;
      slot.innerHTML = message ? `<div class="feedback info">${message}</div>` : "";
    }

    function confirmAnswer() {
      if (locked) return;
      if (digits === "") {
        showInfo("Pulsa primero uno o varios números.");
        return;
      }

      const magnitude = Number(digits);
      const question = questions[currentIndex];
      const zeroWithSign = magnitude === 0 && selectedSign !== "";
      const givenValue = selectedSign === "-" ? -magnitude : magnitude;
      const displayedAnswer = (selectedSign === "+" ? "+" : selectedSign === "-" ? "−" : "") + digits;
      const isCorrect = !zeroWithSign && givenValue === question.answer;

      results.push({
        icon: question.icon,
        text: question.text,
        given: displayedAnswer,
        correct: formatNumber(question.answer),
        isCorrect
      });

      locked = true;
      content.querySelectorAll("button").forEach(button => { button.disabled = true; });

      if (isCorrect) {
        score++;
        showFeedback(true, "¡Muy bien! Has acertado.", "");
      } else if (zeroWithSign) {
        showFeedback(false, "Inténtalo de nuevo.", "Recuerda: el cero es el único número que no necesita signo.");
      } else {
        showFeedback(false, "Inténtalo de nuevo.", "");
      }

      feedbackTimer = window.setTimeout(() => {
        if (currentIndex < 9) {
          currentIndex++;
          renderQuestion();
        } else {
          renderSummary();
        }
      }, 2000);
    }

    function showFeedback(success, message, extra) {
      const slot = document.getElementById("feedback-slot");
      if (!slot) return;
      slot.innerHTML = success
        ? `<div class="feedback good"><span class="success-icon">⭐</span><br>${message}</div>`
        : `<div class="feedback bad">${message}${extra ? `<small>${extra}</small>` : ""}</div>`;
    }

    function renderSummary() {
      const percentage = Math.round(score / 10 * 100);
      let finalMessage;
      if (score >= 8) {
        finalMessage = "¡Enhorabuena! Dominas la interpretación de los números enteros en situaciones cotidianas.";
      } else if (score >= 5) {
        finalMessage = "¡Buen trabajo! Sigue practicando para convertirte en un experto en números enteros.";
      } else {
        finalMessage = "No te preocupes. Repasa cuándo una situación está por encima de cero, por debajo de cero o representa el cero, y vuelve a intentarlo.";
      }

      const rows = results.map((result, index) => `
        <tr>
          <td><div class="row-situation"><span class="row-emoji">${result.icon}</span><span>${index + 1}. ${result.text}</span></div></td>
          <td><span class="${result.isCorrect ? "answer-ok" : "answer-no"}">${result.given}</span>
            <span class="result-label ${result.isCorrect ? "ok" : ""}">${result.isCorrect ? "✓ Correcta" : "✗ Incorrecta"}</span>
          </td>
          <td><span class="correct-answer">${result.correct}</span></td>
        </tr>
      `).join("");

      content.innerHTML = `
        <div class="summary">
          <div class="complete">🏁 MISIÓN COMPLETADA</div>
          <h2 style="color:#12345b;margin:10px 0 0;font-size:27px">¡Has terminado la partida!</h2>
          <div class="score"><strong>${score}/10</strong><span>${percentage}% DE ACIERTOS</span></div>
          <p style="font-weight:900;color:#244d74;margin:8px 0 0">${score} respuestas correctas de 10</p>
          <p class="final-msg">${finalMessage}</p>
          <div class="table-wrap">
            <table>
              <thead><tr><th style="width:58%">Situación presentada</th><th>Tu respuesta</th><th>Respuesta correcta</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <button type="button" class="play-again" id="play-again">↻ Jugar de nuevo</button>
          <p class="footnote">🎲 La siguiente partida tendrá 10 situaciones nuevas respecto a la partida que acabas de completar.</p>
        </div>
      `;

      document.getElementById("play-again").addEventListener("click", startNewGame);
    }

    // Impide introducir respuestas con el teclado físico. La actividad se maneja con los botones.
    // Se bloquean las teclas de caracteres numéricos y signos, pero se mantienen Tab y Enter
    // para facilitar la navegación accesible entre botones.
    document.addEventListener("keydown", event => {
      if (/^[0-9]$/.test(event.key) || event.key === "+" || event.key === "-") {
        event.preventDefault();
        event.stopPropagation();
      }
    }, true);

    startNewGame();
  </script>
</body>
</html>
